<head>
  <meta charset="UTF-8" />

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%}
    body{
      background:#070b14;
      color:#fff;
      font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
      overflow-x:hidden;
    }
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:#070b14}
    ::-webkit-scrollbar-thumb{background:#1e293b;border-radius:2px}

    /* Animated grid floor */
    @keyframes gridScroll{
      from{background-position:0 0}
      to{background-position:60px 60px}
    }
    .world-floor{
      position:fixed;inset:0;
      background-image:
        linear-gradient(rgba(99,102,241,0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.12) 1px, transparent 1px);
      background-size:60px 60px;
      animation:gridScroll 10s linear infinite;
      pointer-events:none;z-index:0;
    }

    /* Plumbob */
    @keyframes plumbobSpin{
      from{transform:rotate(45deg)}
      to{transform:rotate(405deg)}
    }
    @keyframes plumbobFloat{
      0%,100%{top:-28px}
      50%{top:-36px}
    }
    .plumbob{
      position:absolute;left:50%;margin-left:-9px;
      width:18px;height:18px;
      background:linear-gradient(135deg,#22c55e,#86efac,#22c55e);
      box-shadow:0 0 8px #22c55e,0 0 20px rgba(34,197,94,0.5);
      animation:plumbobSpin 2s linear infinite,plumbobFloat 1.5s ease-in-out infinite;
      z-index:20;
    }

    /* Character animations */
    @keyframes walk{
      0%,100%{transform:translateY(0) scaleX(1)}
      30%{transform:translateY(-8px) scaleX(0.94)}
      70%{transform:translateY(-4px) scaleX(1.04)}
    }
    @keyframes think{
      0%,100%{transform:scale(1);opacity:1}
      50%{transform:scale(0.91);opacity:0.65}
    }
    @keyframes idle{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(2px)}
    }
    @keyframes blockShake{
      0%,100%{transform:translateX(0)}
      25%{transform:translateX(-4px)}
      75%{transform:translateX(4px)}
    }
    @keyframes sleepSway{
      0%,100%{transform:scale(0.97) rotate(-3deg);opacity:0.5}
      50%{transform:scale(0.95) rotate(-6deg);opacity:0.4}
    }
    .s-working{animation:walk 0.65s ease-in-out infinite}
    .s-thinking{animation:think 2s ease-in-out infinite}
    .s-idle{animation:idle 3s ease-in-out infinite}
    .s-blocked{animation:blockShake 0.3s ease-in-out infinite}
    .s-sleeping{animation:sleepSway 4s ease-in-out infinite;filter:grayscale(0.4)}
    .s-done{}

    /* Thought bubble */
    @keyframes bubblePop{
      0%{transform:scale(0) translateY(8px);opacity:0}
      60%{transform:scale(1.05) translateY(-2px);opacity:1}
      100%{transform:scale(1) translateY(0);opacity:1}
    }
    .bubble-pop{animation:bubblePop 0.25s ease-out forwards}

    /* ZZZ */
    @keyframes zzzRise{
      0%{opacity:0;transform:translateY(0) scale(0.6)}
      35%{opacity:1}
      100%{opacity:0;transform:translateY(-20px) scale(1.4)}
    }
    .zzz-a{animation:zzzRise 2.4s ease-out infinite 0s backwards}
    .zzz-b{animation:zzzRise 2.4s ease-out infinite 0.8s backwards}
    .zzz-c{animation:zzzRise 2.4s ease-out infinite 1.6s backwards}

    /* XP bar fill */
    @keyframes xpFill{from{width:0}}
    .xp-bar-fill{animation:xpFill 1.4s ease-out forwards}

    /* Panel slide in */
    @keyframes panelIn{
      from{transform:translateX(100%);opacity:0}
      to{transform:translateX(0);opacity:1}
    }
    .panel-in{animation:panelIn 0.28s ease-out forwards}

    /* Overlay */
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .fade-in{animation:fadeIn 0.2s ease-out forwards}

    /* Status dot pulse */
    @keyframes dotPulse{
      0%,100%{opacity:1}
      50%{opacity:0.35}
    }
    .dot-pulse{animation:dotPulse 1.5s ease-in-out infinite}

    /* Room card hover */
    .room-card{
      transition:transform 0.2s ease,box-shadow 0.2s ease;
      cursor:pointer;
    }
    .room-card:hover{transform:translateY(-4px)}
    .room-card:active{transform:translateY(-1px)}
  </style>
</head>

      const base = (a.level-1)*400, cap = a.level*400;
      return Math.min(100, Math.max(0, ((a.xp-base)/(cap-base))*100));
    }

    /* ─── THOUGHT BUBBLE ──────────────────────────────── */

        <div className="bubble-pop" style={{
          position:'absolute',bottom:'100%',left:'50%',
          transform:'translateX(-50%)',marginBottom:10,
          zIndex:30,minWidth:160,maxWidth:210,

          </div>
        </div>
      );
    }

                boxShadow:`0 0 24px ${agent.color}28`,

                  <div style={{textAlign:'right'}}>
                    <div style={{fontSize:10,color:'#475569',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:4}}>Total XP</div>
                    <div style={{fontSize:24,fontWeight:800,color:'#fff'}}>{agent.xp.toLocaleString()}</div>
                  </div>
                </div>
                <div style={{width:'100%',height:8,borderRadius:999,background:'rgba(255,255,255,0.06)',marginBottom:6}}>
                  <div className="xp-bar-fill" style={{
                    height:'100%',borderRadius:999,width:`${pct}%`,
                    background:`linear-gradient(90deg,${agent.color},${agent.accent})`,
                    boxShadow:`0 0 10px ${agent.color}60`,
                  }}/>
                </div>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'#475569'}}>
                  <span>{agent.xp.toLocaleString()} XP</span>
                  <span>{(agent.level*400).toLocaleString()} XP → Lv.{agent.level+1}</span>
                </div>
              </div>

              {/* Stats grid */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
                {[
                  {l:'Tasks Done', v:agent.done},
                  {l:'Day Streak',  v:agent.streak>0?`🔥 ${agent.streak}`:'0'},
                  {l:'Achievements', v:agent.achievements.length},
                ].map(s=>(
                  <div key={s.l} style={{borderRadius:12,padding:'10px 12px',textAlign:'center',background:'#111827',border:'1px solid rgba(255,255,255,0.05)'}}>
                    <div style={{fontSize:18,fontWeight:700,color:'#fff'}}>{s.v}</div>
                    <div style={{fontSize:10,color:'#475569',marginTop:2}}>{s.l}</div>
                  </div>
                ))}
              </div>

              {/* Skills */}
              <div>
                <div style={{fontSize:10,color:'#475569',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:10}}>Skills</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:7}}>
                  {agent.skills.map(s=>(
                    <span key={s} style={{
                      fontSize:11,fontWeight:600,padding:'4px 10px',borderRadius:999,
                      background:`${agent.color}18`,color:agent.text,border:`1px solid ${agent.color}30`,
                    }}>{s}</span>
                  ))}
                </div>
              </div>

              {/* Achievements */}
              {agent.achievements.length>0 && (
                <div>
                  <div style={{fontSize:10,color:'#475569',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:10}}>Achievements</div>
                  <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    {agent.achievements.map(a=>(
                      <div key={a.title} style={{
                        display:'flex',gap:12,padding:12,borderRadius:12,
                        background:'#111827',border:'1px solid rgba(255,255,255,0.05)',
                        alignItems:'flex-start',
                      }}>
                        <span style={{fontSize:22,lineHeight:1}}>{a.emoji}</span>
                        <div>
                          <div style={{fontSize:13,fontWeight:700,color:'#fff'}}>{a.title}</div>
                          <div style={{fontSize:11,color:'#64748b',marginTop:2}}>{a.desc}</div>
                          <div style={{fontSize:10,color:'#334155',marginTop:4}}>{a.date}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* GitHub link */}
              <a
                href={agent.repoUrl}
                target="_blank"
                rel="noopener noreferrer"
                style={{
                  display:'flex',justifyContent:'space-between',alignItems:'center',
                  padding:'12px 16px',borderRadius:12,textDecoration:'none',
                  background:`${agent.color}15`,border:`1px solid ${agent.color}30`,
                  color:agent.accent,fontSize:13,fontWeight:600,
                }}
              >
                <span>View Repository ↗</span>
                <span style={{fontSize:10,color:'#64748b',fontFamily:'monospace'}}>{agent.repo}</span>
              </a>
            </div>
          </div>
        </>
      );
    }

    /* ─── SCOREBOARD ──────────────────────────────────── */
    function Scoreboard({agents}) {
      const sorted = [...agents].sort((a,b)=>b.xp-a.xp);
      const medals = ['🥇','🥈','🥉'];

      return (
        <div style={{marginTop:32,borderRadius:20,overflow:'hidden',background:'#0d1120',border:'1px solid rgba(255,255,255,0.05)'}}>
          <div style={{padding:'14px 20px',borderBottom:'1px solid rgba(255,255,255,0.05)',display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:16}}>🏆</span>
            <span style={{fontWeight:700,fontSize:14,color:'#fff'}}>Agent Leaderboard</span>
            <span style={{marginLeft:'auto',fontSize:11,color:'#475569'}}>Ranked by XP</span>
          </div>
          {sorted.map((agent,i)=>(
            <div key={agent.id} style={{
              display:'flex',alignItems:'center',gap:12,
              padding:'10px 20px',
              borderBottom:i<sorted.length-1?'1px solid rgba(255,255,255,0.03)':'none',
            }}>
              <div style={{width:28,textAlign:'center',fontSize:14,fontWeight:700,color:'#475569',flexShrink:0}}>
                {medals[i]||`#${i+1}`}
              </div>
              <div style={{
                width:36,height:36,borderRadius:10,flexShrink:0,
                background:`${agent.color}20`,border:`1px solid ${agent.color}30`,
                display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,
              }}>{agent.emoji}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:13,fontWeight:700,color:'#fff'}}>{agent.name}</span>
                  <span style={{fontSize:10,padding:'1px 6px',borderRadius:999,fontWeight:600,background:`${agent.color}20`,color:agent.accent}}>
                    {LVL[agent.level]}
                  </span>
                </div>
                <div style={{fontSize:11,color:'#475569',marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{agent.role}</div>
              </div>
              <div style={{width:80,flexShrink:0}}>
                <div style={{width:'100%',height:3,borderRadius:999,background:'rgba(255,255,255,0.05)'}}>
                  <div style={{
                    height:'100%',borderRadius:999,
                    width:`${xpPct(agent)}%`,
                    background:`linear-gradient(90deg,${agent.color},${agent.accent})`,
                  }}/>
                </div>
              </div>
              <div style={{textAlign:'right',flexShrink:0}}>
                <div style={{fontSize:13,fontWeight:700,color:agent.accent}}>{agent.xp.toLocaleString()}</div>
                <div style={{fontSize:10,color:'#475569'}}>Lv.{agent.level}</div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    /* ─── HEADER ──────────────────────────────────────── */
    function Header({agents}) {
      const totalXP = agents.reduce((s,a)=>s+a.xp,0);
      const online  = agents.filter(a=>a.status==='working'||a.status==='thinking').length;
      const today   = new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',year:'numeric'});

      return (
        <header style={{
          position:'sticky',top:0,zIndex:30,
          borderBottom:'1px solid rgba(255,255,255,0.05)',
          background:'rgba(7,11,20,0.92)',
          backdropFilter:'blur(12px)',
          padding:'13px 24px',
          display:'flex',alignItems:'center',justifyContent:'space-between',gap:16,
        }}>
          {/* Logo */}
          <div style={{display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
            <div style={{
              width:36,height:36,borderRadius:10,
              background:'rgba(99,102,241,0.2)',border:'1px solid rgba(99,102,241,0.4)',
              display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,
            }}>🌐</div>
            <div>
              <div style={{fontWeight:800,fontSize:14,color:'#fff',letterSpacing:'0.02em'}}>AGENT WORLD</div>
              <div style={{fontSize:10,color:'#6366f1',letterSpacing:'0.1em',textTransform:'uppercase'}}>Plug AI Operations</div>
            </div>
          </div>

          {/* Chips */}
          <div style={{display:'flex',alignItems:'center',gap:8,flex:1,justifyContent:'center',flexWrap:'wrap'}}>
            {[
              {l:'Agents',  v:agents.length,                c:'#6366f1'},
              {l:'Total XP',v:totalXP.toLocaleString(),    c:'#f59e0b'},
              {l:'Online',  v:`${online} active`,c:'#22c55e',dot:true},
              {l:'Repos',   v:'8 linked',                  c:'#0ea5e9'},
            ].map(chip=>(
              <div key={chip.l} style={{
                display:'flex',alignItems:'center',gap:6,
                padding:'5px 12px',borderRadius:999,
                background:`${chip.c}12`,border:`1px solid ${chip.c}30`,
                color:chip.c,fontSize:12,fontWeight:600,
              }}>
                {chip.dot && <div className="dot-pulse" style={{width:6,height:6,borderRadius:'50%',background:chip.c}} />}
                <span style={{color:'rgba(255,255,255,0.4)',fontWeight:400}}>{chip.l}:</span>
                <span>{chip.v}</span>
              </div>
            ))}
          </div>

          {/* Date */}
          <div style={{textAlign:'right',flexShrink:0}}>
            <div style={{fontSize:12,color:'#94a3b8',fontWeight:500}}>{today}</div>
            <div style={{fontSize:10,color:'#6366f1',marginTop:2}}>Morris Stephon · Plug AI</div>
          </div>
        </header>
      );
    }

    /* ─── APP ─────────────────────────────────────────── */
    function App() {
      const [selected, setSelected] = useState(null);
      const [tick, setTick] = useState(0);

      useEffect(()=>{
        const id = setInterval(()=>setTick(t=>t+1), 2500);
        return ()=>clearInterval(id);
      },[]);

      function pick(agent) {
        setSelected(prev=>prev?.id===agent.id ? null : agent);
      }

      return (
        <div style={{minHeight:'100vh',position:'relative'}}>
          <div className="world-floor" />

          {/* Center radial glow */}
          <div style={{
            position:'fixed',inset:0,pointerEvents:'none',
            background:'radial-gradient(ellipse 70% 40% at 50% 20%,rgba(99,102,241,0.07) 0%,transparent 70%)',
          }}/>

          <Header agents={AGENTS} />

          <main style={{position:'relative',zIndex:1,maxWidth:1200,margin:'0 auto',padding:'28px 20px'}}>

            {/* World label */}
            <div style={{textAlign:'center',marginBottom:24}}>
              <div style={{
                display:'inline-flex',alignItems:'center',gap:8,
                padding:'6px 16px',borderRadius:999,
                background:'rgba(255,255,255,0.03)',border:'1px solid rgba(255,255,255,0.06)',
                fontSize:12,color:'#64748b',
              }}>
                <div className="dot-pulse" style={{width:6,height:6,borderRadius:'50%',background:'#6366f1'}} />
                Click any agent to inspect &nbsp;·&nbsp; {AGENTS.length} agents deployed across {new Set(AGENTS.map(a=>a.entity)).size} entities
              </div>
            </div>

            {/* Agent grid */}
            <div style={{
              display:'grid',
              gridTemplateColumns:'repeat(auto-fill,minmax(210px,1fr))',
              gap:14,
            }}>
              {AGENTS.map(agent=>(
                <AgentCard
                  key={agent.id}
                  agent={agent}
                  selected={selected?.id===agent.id}
                  tick={tick}
                  onSelect={()=>pick(agent)}
                />
              ))}
            </div>

            <Scoreboard agents={AGENTS} />

            {/* Footer */}
            <div style={{textAlign:'center',marginTop:24,fontSize:11,color:'#1e293b'}}>
              Agent World v1.0 · Plug AI · Morris Stephon
            </div>
          </main>

          {selected && (
            <AgentPanel agent={selected} onClose={()=>setSelected(null)} />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
